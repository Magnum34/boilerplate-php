[PHP]
expose_php = Off
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60

[Date]
date.timezone = "UTC"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
; Development friendly: re-check files on every request.
; In production set validate_timestamps = 0 for best performance.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
